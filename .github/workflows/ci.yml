name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - master
      - "feature/**"
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and build (non-distributable CI build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run debug-variant unit tests
        run: ./gradlew --no-daemon testGithubDebugUnitTest

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Build debug APK for compile verification
        run: ./gradlew --no-daemon assembleGithubDebug

      # CI debug APKs are compile checks, not upgrade/install artifacts. Release APKs
      # must be signed with the same persistent keystore used by prior distributed builds.
